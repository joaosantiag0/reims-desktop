<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Outer GPU/VM ring -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 8" />

  <!-- Center Apple / Display Stylized Symbol -->
  <path d="M128 72 C108 72 96 86 96 106 C96 138 128 168 128 168 C128 168 160 138 160 106 C160 86 148 72 128 72 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="128" cy="114" r="14" fill="#FFFFFF" />

  <!-- Speed / Acceleration Rays -->
  <path d="M60 128 L80 128 M176 128 L196 128 M128 60 L128 80 M128 176 L128 196" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
</svg>
