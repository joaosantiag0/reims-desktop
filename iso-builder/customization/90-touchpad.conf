Section "InputClass"
        Identifier "touchpad catchall"
        Driver "libinput"
        MatchIsTouchpad "on"
        MatchDevicePath "/dev/input/event*"
        Option "Tapping" "True"
        Option "TappingDrag" "True"
        Option "TappingDragLock" "False"
        Option "ClickMethod" "clickfinger"
        Option "NaturalScrolling" "False"
        Option "DisableWhileTyping" "True"
        Option "MiddleEmulation" "True"
        Option "AccelSpeed" "0.15"
EndSection

Section "InputClass"
        Identifier "Synaptics Touchpad I2C"
        Driver "libinput"
        MatchProduct "SYNA7DB5|Synaptics|Touchpad"
        Option "Tapping" "True"
        Option "TappingDrag" "True"
        Option "ClickMethod" "clickfinger"
EndSection
