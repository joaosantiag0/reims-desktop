# Calamares Contextual Process - Post-Installation Hooks for ReimsOS
---
dont-chroot: false

contextualProcess:
  - name: "Configurar permissões KVM e udmabuf para o usuário"
    commands:
      - "usermod -aG kvm,render,video ${USER}"
      - "systemctl enable sddm"
      - "systemctl enable NetworkManager"
      - "systemctl enable bluetooth"
