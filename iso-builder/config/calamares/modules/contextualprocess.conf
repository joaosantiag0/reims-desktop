# Calamares Contextual Process - Post-Installation Hooks for ReimsOS
---
dont-chroot: false

contextualProcess:
  - name: "Configurar permissões KVM e udmabuf para o usuário"
    commands:
      - "usermod -aG kvm,render,video ${USER}"
      - "systemctl enable sddm"
      - "systemctl enable NetworkManager"
      - "systemctl enable bluetooth"
      - "systemctl enable ssh 2>/dev/null || true"
  - name: "Remover bloatware e programas residuais do Lubuntu"
    commands:
      - "apt-get purge -y libreoffice-core libreoffice-common vlc vlc-bin vlc-data firefox thunderbird transmission-qt transmission-common 2048-qt gnome-mines aisleriot skanlite kcalc noblenote featherpad* qtpass* redshift* texinfo* info vim* picom* compton* imagemagick* lximage-qt* screengrab* 2>/dev/null || true"
      - "apt-get autoremove --purge -y || true"
      - "snap remove --purge firefox thunderbird 2>/dev/null || true"
  - name: "Aplicar tema oficial do GRUB do Reims Desktop no disco instalado"
    commands:
      - "/usr/bin/reims-boot-theme-apply || true"
