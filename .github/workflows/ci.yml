name: Reims Desktop CI

on:
  push:
    branches: [ "master", "main", "development" ]
  pull_request:
    branches: [ "master", "main", "development" ]

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r reims-gui/requirements.txt
          pip install -r reims-web/requirements.txt

      - name: Run Core & Pipeline Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run reims-gui Unit Tests
        run: |
          cd reims-gui
          PYTHONPATH=src python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run reims-web Unit Tests
        run: |
          PYTHONPATH=reims-gui/src:reims-web/src python3 -m unittest discover -s reims-web/tests -p "test_*.py" -v

      - name: Run Debian Packaging Tests
        run: |
          python3 -m unittest discover -s packaging/tests -p "test_*.py" -v

      - name: Run ISO Builder Tests
        run: |
          python3 -m unittest discover -s iso-builder/tests -p "test_*.py" -v

      - name: Build Debian Packages (reims-core, reims-gui, reims-web, reims-vgpu)
        run: |
          ./packaging/scripts/build_all.sh --mock

      - name: Validate ISO Builder Pipeline (Dry-Run)
        run: |
          ./iso-builder/scripts/build_iso.sh --dry-run

      - name: Upload Debian Packages Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reims-debian-packages
          path: dist/*.deb
