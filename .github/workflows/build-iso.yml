name: Build Reims Desktop ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Build All Reims Debian Packages
        run: |
          ./packaging/scripts/build_all.sh --mock

      - name: Build Reims Desktop ISO
        run: |
          sudo ./iso-builder/scripts/build_iso.sh

      - name: Upload Reims Desktop ISO Image (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: reims-desktop-iso
          path: dist/iso/*.iso
          retention-days: 7

      - name: Attach ISO to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/iso/*.iso
