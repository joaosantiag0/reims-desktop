name: Deploy APT Repository to GitHub Pages

on:
  push:
    branches: [development, main, master]
    paths:
      - "packaging/**"
      - "reims-gui/**"
      - "iso-builder/**"
      - "scripts/generate_apt_repo.py"
      - ".github/workflows/apt-repo.yml"
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-repo-publish
  cancel-in-progress: true

jobs:
  build-and-deploy-apt:
    name: Build & Publish APT Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build All Reims Debian Packages
        run: |
          # Versão sempre crescente para o apt considerar upgrade a cada publish
          export REIMS_VERSION="0.1.0+build.$(date -u +%Y%m%d%H%M%S)"
          echo "Building packages as ${REIMS_VERSION}"
          ./packaging/scripts/build_all.sh

      - name: Import APT signing key
        env:
          REIMS_APT_PRIVATE_KEY: ${{ secrets.REIMS_APT_PRIVATE_KEY }}
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$REIMS_APT_PRIVATE_KEY" | gpg --homedir "$RUNNER_TEMP/gnupg" --batch --import
          gpg --homedir "$RUNNER_TEMP/gnupg" --list-keys

      - name: Generate APT Repository Structure
        run: |
          # O reims-vgpu (QEMU upstream, ~212 MB) não vai para o apt: o GitHub
          # Pages tem limite de 100 MB por arquivo, e publicar a versão
          # estável (stub) derrubaria a upstream instalada via apt upgrade.
          # O stack upstream é distribuído pela Release (reims-vgpu-amd64.deb),
          # consumida pelo reims-firstboot-setup.
          rm -f dist/reims-vgpu_*.deb
          python3 scripts/generate_apt_repo.py --deb-dir dist --out-dir repo

      - name: Sign repository metadata (InRelease + Release.gpg)
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          test -f repo/dists/noble/Release
          gpg --batch --yes --clearsign -o repo/dists/noble/InRelease repo/dists/noble/Release
          gpg --batch --yes --armor --detach-sign -o repo/dists/noble/Release.gpg repo/dists/noble/Release
          echo "---- dists/noble ----"
          ls -la repo/dists/noble/

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
