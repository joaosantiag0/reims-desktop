[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reims-desktop"
version = "0.1.0"
description = "Unofficial Graphical User Interface for reims-desktop-ctl and reims-vgpu on Reims Desktop / Linux"
readme = "README.md"
authors = [
    { name = "Reims Desktop Team" }
]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
reims-desktop = "reims_gui.main:main"
reims-gui = "reims_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
