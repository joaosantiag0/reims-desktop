[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reims-gui"
version = "0.1.0"
description = "Graphical User Interface for reims-ctl and reims-vgpu on ReimsOS / Ubuntu"
readme = "README.md"
authors = [
    { name = "ReimsOS Team" }
]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
reims-gui = "reims_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
